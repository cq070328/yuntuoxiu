# ⚡ 云脱修 编译提速配置（不影响产物内容，只加速）
# JVM 内存：Gradle 8 + AGP 8 建议 3-4G（CI 上 2G 偏紧易 GC 抖动）
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ⚡ 并行构建（多模块并行编译）
org.gradle.parallel=true
# ⚡ 构建缓存（同 key 命中直接复用产物）
org.gradle.caching=true
# ⚡ 配置缓存（跳过重复的配置阶段，二次编译显著提速）
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Gradle daemon 复用（CI 里也能省启动时间）
org.gradle.daemon=true