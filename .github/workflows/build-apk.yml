name: Build YunTuoXiu APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: 安装 Android cmdline-tools
        run: |
          SDK_ROOT=$HOME/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          cd /tmp
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d $SDK_ROOT/cmdline-tools/
          mv $SDK_ROOT/cmdline-tools/cmdline-tools $SDK_ROOT/cmdline-tools/latest
          echo ANDROID_HOME=$SDK_ROOT >> $GITHUB_ENV
          echo ANDROID_SDK_ROOT=$SDK_ROOT >> $GITHUB_ENV
          echo $SDK_ROOT/cmdline-tools/latest/bin >> $GITHUB_PATH

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager platforms\;android-34 build-tools\;34.0.0 platform-tools

      - name: 生成 local.properties
        working-directory: client
        run: echo sdk.dir=$ANDROID_HOME > local.properties

      - name: 编译 Debug APK
        working-directory: client
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 列出产物
        if: always()
        run: find client/app/build/outputs -name *.apk 2>/dev/null || echo none

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yuntuoxiu-debug-apk
          path: client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
